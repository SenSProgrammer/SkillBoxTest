openapi: 3.1.0
info:
  title: LiveBook API (Prototype)
  version: 0.1.0
servers:
  - url: http://localhost:8787
paths:
  /health:
    get:
      summary: Health
      responses: { '200': { description: OK } }
  /ext/rc/import-json:
    post:
      summary: Import JSON manifest and create RC
      responses: { '200': { description: RC created } }
  /ext/rc/export-json:
    get:
      summary: Export RC as JSON
      parameters:
        - in: query
          name: rc_id
          schema: { type: string }
      responses: { '200': { description: OK } }
  /ext/cross/grant:
    post:
      summary: Create cross-access grant
      responses: { '200': { description: OK } }
  /ext/cross/alignments:
    post:
      summary: Submit alignments
      responses: { '200': { description: OK } }
  /ext/cross/arbitrate:
    post:
      summary: Start AI arbitration
      responses: { '200': { description: OK } }
  /ext/cross/arbitrations/{id}/result:
    get:
      summary: Get arbitration result
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }
