<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LiveBook Author UI (Minimal)</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#0b1020;color:#e6ecff}
.wrap{padding:16px;max-width:1200px;margin:0 auto}
h1{font-size:20px;margin:8px 0 16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:280px;background:#121933;border:1px solid #223055;border-radius:12px;padding:12px}
input,select,button,textarea{background:#0f1630;color:#e6ecff;border:1px solid #2a3b66;border-radius:8px;padding:8px}
button{cursor:pointer}
.grid{display:grid; grid-template-columns: 1fr 1fr; gap:8px}
.thesis{padding:6px;border:1px solid #2a3b66;border-radius:8px;background:#0f1630}
.thesis.sel{outline:2px solid #7aa2ff}
.pairs li{margin:4px 0}
.badge{display:inline-block;padding:2px 6px;border-radius:6px;background:#23325a;border:1px solid #2a3b66;font-size:12px}
.mapping{width:100%;border-collapse:collapse}
.mapping td,.mapping th{border:1px solid #2a3b66;padding:6px}
.mapping th{background:#172346}
.btnRow{display:flex;gap:8px;flex-wrap:wrap}
.note{opacity:.8;font-size:12px}
.err{color:#ff9b9b}
</style></head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
