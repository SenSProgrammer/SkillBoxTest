version: "3.9"
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: livebook
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
  adminer:
    image: adminer
    restart: unless-stopped
    ports: ["8081:8080"]
volumes:
  pgdata:
